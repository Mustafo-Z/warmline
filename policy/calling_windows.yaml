# Calling-hours policy. SPEC 4.2.
#
# Windows are per day and half-open, [start, end): with 09:00-18:00, a call at
# exactly 09:00:00 local is allowed and one at exactly 18:00:00 local is
# blocked. A day absent from a profile is not a calling day at all.
#
# Per day rather than one window plus a list of days, because a working week is
# not always uniform: the UAE's Friday is a half day, and flattening that would
# mean either calling people on Friday afternoon or not calling them on Friday
# at all. Both are wrong.
#
# AE is the default and the profile the seed data uses. UK and US exist so the
# timezone logic is proven against more than one window; they are exercised by
# the tests, not by seed data.

policy_version: "1.0.0"
default_profile: AE

profiles:
  # The UAE moved to a Monday-Friday working week in January 2022. The weekend
  # is Saturday and Sunday, and Friday is a half day for the federal sector.
  # This project had sun-thu until 2026-09-11, which was the pre-2022 week and
  # had been wrong for four years.
  AE:
    countries: [AE]
    days:
      mon: { start: "09:00", end: "18:00" }
      tue: { start: "09:00", end: "18:00" }
      wed: { start: "09:00", end: "18:00" }
      thu: { start: "09:00", end: "18:00" }
      fri: { start: "09:00", end: "12:00" }
  UK:
    countries: [GB]
    days:
      mon: { start: "09:00", end: "18:00" }
      tue: { start: "09:00", end: "18:00" }
      wed: { start: "09:00", end: "18:00" }
      thu: { start: "09:00", end: "18:00" }
      fri: { start: "09:00", end: "18:00" }
  US:
    countries: [US, CA]
    days:
      mon: { start: "09:00", end: "20:00" }
      tue: { start: "09:00", end: "20:00" }
      wed: { start: "09:00", end: "20:00" }
      thu: { start: "09:00", end: "20:00" }
      fri: { start: "09:00", end: "20:00" }

attempt_limits:
  max_per_24h: 1
  max_per_rolling_7d: 3

# What TIMEZONE_PREFIX_MISMATCH does when it fires: block (default) or warn.
timezone_mismatch_action: block

# Countries each supported IANA timezone belongs to, used by
# TIMEZONE_PREFIX_MISMATCH to compare the declared timezone against the country
# implied by the phone number's E.164 prefix.
#
# This is a hand-maintained map rather than a library lookup on purpose: it is
# policy-relevant geography, so it belongs in a file a reviewer can read and
# diff. A timezone that is not listed here is not silently trusted — the check
# returns CHECK_NOT_EVALUABLE, which blocks (SPEC 4.1, fail closed).
timezone_countries:
  Asia/Dubai: [AE]
  Europe/London: [GB]
  America/New_York: [US]
  America/Chicago: [US]
  America/Denver: [US]
  America/Los_Angeles: [US]
  America/Toronto: [CA]
  America/Vancouver: [CA]
