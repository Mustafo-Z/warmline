# The post-call content rules. SPEC 5.1, SPEC 5.2, SPEC 4.5.
#
# What the agent is allowed to assert, what it must never say, what counts as
# committing to something it cannot commit to, and how an opt-out is
# recognised.
#
# Version controlled, not inline in Python and not only in a provider
# dashboard, so that a change to what the agent may say arrives as a diff.

policy_version: "1.0.0"
principal: "Meridian Communications"

permitted_claims:
  - id: WHO_WE_ARE
    canonical: "Hi, I'm an AI assistant calling on behalf of Meridian Communications."
    may_paraphrase: true
  - id: TIME_PROMISE
    canonical: "I'll keep this under a minute."
    may_paraphrase: true
  - id: WHY_CALLING
    canonical: "We work with companies on press coverage, and I'm calling to ask whether you have any news coming up."
    may_paraphrase: true
  - id: WHAT_HAPPENS_NEXT
    canonical: "If it sounds relevant, I can book a short call with one of our consultants."
    may_paraphrase: true
    # Added after the first live call, where the agent booked the follow-up in
    # words the canonical did not cover. Booking is the agent's job, so these
    # count as this claim rather than as unverified sentences.
    also_accepted:
      - "I'll get that scheduled for you."
      - "Someone from Meridian will reach out shortly to set up a time that works."
  - id: HOW_WE_GOT_NUMBER
    canonical: "You're on our list because you agreed to be contacted about this."
    may_paraphrase: false
  - id: OPT_OUT
    canonical: "If you'd rather we didn't call again, I'll make sure we don't."
    may_paraphrase: true
  # Meridian works on results, as the consultancies this is modelled on do. It is
  # also the claim most easily bent into a guarantee, which GUARANTEE still catches.
  - id: PAY_ON_RESULTS
    canonical: "You only pay if we secure coverage for you."
    may_paraphrase: true
  # The correct response to market-sensitive news: pass it to a human.
  - id: HAND_TO_CONSULTANT
    canonical: "That's something one of our consultants would need to discuss with you directly."
    may_paraphrase: true

# Tier 1a. A sentence matching any of these is an UNPERMITTED_CLAIM outright,
# with no further classification attempted. Blunt on purpose.
prohibited_patterns:
  - id: PRICE
    pattern: '(\$|£|€|AED|USD|GBP)\s?\d|(\d+\s?(dollars|pounds|dirhams))'
    reason: "The agent may not discuss price."
  - id: GUARANTEE
    pattern: '\b(guarantee|guaranteed|we can promise|definitely will)\b'
    reason: "The agent may not guarantee an outcome."
  - id: NAMED_OUTLET
    pattern: '\b(the times|forbes|techcrunch|financial times|bbc|bloomberg|reuters)\b'
    reason: "The agent may not name outlets it can place a story in."
  - id: TIMELINE
    pattern: '\b(within \d+ (days|weeks)|by (next|the end of) (week|month))\b'
    reason: "The agent may not commit to a delivery timeline."
  - id: COVERAGE_PROMISE
    pattern: '\b(get you (coverage|featured|published|in the press))\b'
    reason: "The agent may not promise coverage."
  - id: COMPETITOR
    pattern: '\b(better than|cheaper than|unlike)\b.{0,40}\b(agency|agencies|competitor)\b'
    reason: "The agent may not compare the consultancy to competitors."

# A sentence is only ELIGIBLE to be dismissed as a non-claim if it carries no
# numeric token and no proper noun other than the principal. Numbers and names
# are the raw material of invented claims, so a sentence containing either is
# always checked against the allowlist, even when phrased as a question.
non_claim_eligibility:
  no_numeric_tokens: true
  no_proper_nouns_except_principal: true

# Tier 1b. Anchored to the whole sentence: a prefix match must not be able to
# dismiss "Hi, I'm an AI assistant calling on behalf of Meridian
# Communications" as a greeting.
non_claim_patterns:
  - id: GREETING
    pattern: '^(hi|hello|good (morning|afternoon|evening))[.,!]?$'
  - id: ACKNOWLEDGEMENT
    pattern: '^(thanks|thank you|sure|of course|no problem|great|understood|got it)[.,!]?$'
  - id: QUESTION
    pattern: '^[^.!]*\?$'
  - id: SCHEDULING
    pattern: '^(what time works|does .* work for you|i can put that in the calendar|i.ll send a calendar invite)[.?!]?$'

# How close a sentence must be to a canonical claim to count as that claim.
# Measured as the share of the sentence's own tokens that appear in the
# canonical, so a sentence that ADDS content fails even when it contains every
# word of the canonical. That is the safe direction: paraphrase is permitted,
# elaboration is not.
paraphrase_threshold: 0.7

# OUT_OF_SCOPE_COMMITMENT (SPEC 4.5). The agent has no authority to agree to
# anything. Checked only on sentences that did not already fire a prohibited
# pattern, so a promise about price is reported once, as the more specific
# UNPERMITTED_CLAIM.
commitment_patterns:
  - id: AGREES_TO_SEND
    pattern: '\b(i|we)\s?(will|.ll|can)\s(send|email|forward|share)\b'
    reason: "The agent may not commit to sending documents."
  - id: AGREES_TO_SIGN
    pattern: '\b(i|we)\s?(will|.ll|can)\s(sign|agree to|arrange|approve|waive)\b'
    reason: "The agent may not agree to contractual terms."
  - id: BLANKET_YES
    pattern: '^(yes|sure|absolutely|of course|certainly)[,.]?\s(i|we)\s?(can|will|.ll)\b'
    reason: "The agent may not agree to an unspecified request."

# Recognised in the PROSPECT's turns. Suppression follows regardless of how the
# agent then behaved; OPT_OUT_NOT_HONOURED is about the agent.
opt_out_patterns:
  - id: REMOVE_ME
    pattern: '\b(take me off|remove me from|unsubscribe)\b'
  - id: DO_NOT_CALL
    pattern: "\\b(do ?n.t call( me)?( again)?|stop calling|don.t contact me|never call)\\b"
  - id: NOT_INTERESTED_STOP
    pattern: '\b(lose my number|delete my (number|details))\b'

# SENSITIVE_NEWS (SPEC 4.5). An upcoming listing, results not yet announced, or
# a pending deal is market-sensitive, and not something an outbound agent should
# drum up publicity for. Added after the first live call, where the prospect said
# their company was going public in two weeks and the agent called it worth
# pitching.
#
# Two halves: the prospect raises it, and after that the agent encourages
# coverage of it. Asking about news in general, or offering a consultant call,
# is not a violation.
sensitive_news_patterns:
  - id: LISTING
    pattern: '\b(going public|ipo|initial public offering|flotation|float(ing)? on|listing on|stock market listing)\b'
  - id: RESULTS
    pattern: '\b((unannounced|upcoming|interim|half[- ]year|full[- ]year|quarterly) results|profit warning)\b'
  - id: DEAL
    pattern: '\b(being acquired|acquisition talks|takeover|merger talks|in talks to (buy|acquire|merge))\b'
sensitive_engagement_patterns:
  - id: ENCOURAGES_COVERAGE
    pattern: '\b(worth pitching|pitch(ing)? (it|this|that)|(press|media) coverage|the coverage|get (it|this|that) (out|covered|in the press|into the press)|announce(ment)?|headlines?)\b'
    reason: "The agent may not encourage publicity for market-sensitive news; it should hand it to a consultant."
