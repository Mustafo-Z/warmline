[project]
name = "warmline"
version = "0.1.0"
description = "Policy layer for an outbound AI voice agent. Demo; places no calls."
requires-python = ">=3.11"
dependencies = [
    "phonenumbers>=8.13",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Only for evals/, which are run by hand and never in CI (SPEC 9.3).
evals = [
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in a parameter default is the FastAPI idiom, not a mutable default.
"src/warmline/api/*.py" = ["B008"]
